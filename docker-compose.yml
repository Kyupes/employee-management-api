services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_api
    ports:
      -  "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend_net
    volumes:
      - ./src:/app/src
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: employee_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net

  redis:
    image: redis:6.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
    -  "6379:6379"
    networks:
      - backend_net

volumes:
  pg_data:

networks:
  backend_net: